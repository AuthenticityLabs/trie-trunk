[package]
name = "pil-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[features]
gzip = ["dep:flate2"]

[dependencies]
flate2 = { version = "1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
ciborium = "0.2.2"
ciborium-ll = "0.2.2"

[[bench]]
name = "codecs"
harness = false

[[bench]]
name = "shared_refs"
harness = false
