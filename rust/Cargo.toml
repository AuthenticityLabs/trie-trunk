[package]
name = "trie-trunk-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[dependencies]
pil-codec = { path = "../pil" }
sha2 = "0.10"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ciborium = "0.2.2"
ciborium-ll = "0.2.2"
crc32c = "0.6.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.25"

[[bin]]
name = "trunk-search"
path = "src/main.rs"

[[bench]]
name = "search"
harness = false

[lib]
crate-type = ["rlib", "staticlib"]
